<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المشرفين - مراسي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        whale: {
                            50: '#f0f8ff',
                            100: '#e0f2fe',
                            500: '#0077b6',
                            600: '#023e8a',
                            700: '#03045e',
                            light: '#48cae4',
                            sky: '#90e0ef'
                        },
                        sea: { dark: '#03045e', accent: '#ff6b6b' }
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        html, body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="text-gray-800 flex items-center justify-center min-h-screen p-3 sm:p-4">

    <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-xl border border-whale-100 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-whale-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-black text-whale-700">بوابة إدارة النظام</h1>
            <p class="text-xs text-gray-500">مخصص لمشرفي ومسؤولي المبيعات فقط 🔒</p>
        </div>

        <div id="errorMsg" class="bg-red-50 text-red-600 text-xs font-bold p-3 rounded-xl border border-red-200 hidden"></div>

        <form onsubmit="handleAdminLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-gray-700 mb-1">اسم مستخدم المشرف</label>
                <input type="text" id="adminUsername" autocomplete="username" required class="w-full px-4 py-3 border border-whale-100 focus:border-whale-500 rounded-xl outline-none font-bold transition-colors" placeholder="admin">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">كلمة المرور</label>
                <input type="password" id="adminPassword" autocomplete="current-password" required class="w-full px-4 py-3 border border-whale-100 focus:border-whale-500 rounded-xl outline-none font-bold transition-colors" placeholder="••••••••">
            </div>
            <button type="submit" id="adminLoginBtn" class="w-full py-3.5 bg-whale-600 hover:bg-whale-700 text-white rounded-xl font-bold text-sm shadow-sm transition-all">
                دخول لوحة التحكم 🚀
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs font-bold text-whale-600 hover:text-whale-700 hover:underline">
                العودة لصفحة المتجر الرئيسية 🌊
            </a>
        </div>
    </div>

    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            const errorBox = document.getElementById('errorMsg');
            const btn = document.getElementById('adminLoginBtn');
            errorBox.classList.add('hidden');
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data && data.success) {
                    localStorage.setItem('fish_admin', JSON.stringify(data.user));
                    window.location.href = 'admin.html';
                } else {
                    errorBox.textContent = (data && data.message) || 'بيانات دخول المشرف غير صحيحة';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.textContent = 'حدث خطأ أثناء الاتصال بالسيرفر';
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
