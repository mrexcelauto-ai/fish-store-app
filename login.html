<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المشرفين - أسماك البحر الطازجة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ocean: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490', 800: '#155e75', 900: '#164e63' },
                        sea: { dark: '#0a2540', accent: '#ff6b6b' }
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style> body { font-family: 'Cairo', sans-serif; background-color: #0a2540; } </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 space-y-6 relative overflow-hidden">
        <div class="text-center space-y-2">
            <div class="inline-flex bg-ocean-600 text-white p-4 rounded-2xl shadow-lg shadow-ocean-600/30">
                <i class="fa-solid fa-fish-fins text-3xl"></i>
            </div>
            <h2 class="text-2xl font-black text-sea-dark">تسجيل دخول المشرفين</h2>
            <p class="text-xs text-ocean-600 font-semibold">لوحة إدارة متجر أسماك البحر الطازجة 🌊</p>
        </div>

        <div id="errorAlert" class="hidden bg-red-50 border border-red-200 text-red-600 text-xs font-bold p-3 rounded-xl text-center">
            اسم المستخدم أو كلمة المرور غير صحيحة! ❌
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-sm">
            <div class="space-y-1">
                <label class="block font-semibold text-gray-700">اسم المستخدم</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم (admin)" class="w-full pr-10 pl-3 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-ocean-500 text-sm">
                </div>
            </div>

            <div class="space-y-1">
                <label class="block font-semibold text-gray-700">كلمة المرور</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pr-10 pl-3 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-ocean-500 text-sm">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-ocean-600 hover:bg-ocean-700 text-white font-bold rounded-xl shadow-lg shadow-ocean-600/30 transition-all flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');

            try {
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    localStorage.setItem('fish_admin_logged_in', 'true');
                    localStorage.setItem('fish_admin_username', result.user.username);
                    localStorage.setItem('fish_admin_role', result.user.role || 'مدير عام');
                    window.location.href = 'admin.html';
                } else {
                    errorAlert.classList.remove('hidden');
                }
            } catch (error) {
                errorAlert.textContent = 'تعذر الاتصال بالخادم.';
                errorAlert.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
